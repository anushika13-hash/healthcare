<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Healthcare Access System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f8fc;
            color: #1f2937;
        }

        .container {
            max-width: 500px;
            margin: 70px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #1677c8;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #1677c8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #125f9e;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🏥 Healthcare Access</h1>

            <p class="subtitle">
                Your healthcare, all in one place.
            </p>

            <form id="userForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="number"
                    id="age"
                    placeholder="Age"
                    required
                >

                <input
                    type="text"
                    id="address"
                    placeholder="Home Address"
                    required
                >

                <input
                    type="tel"
                    id="phone"
                    placeholder="Phone Number"
                    required
                >

                <button type="submit">
                    Continue
                </button>

            </form>

        </div>

    </div>

    <script>
        document.getElementById("userForm").addEventListener("submit", function(event) {

            event.preventDefault();

            localStorage.setItem(
                "userName",
                document.getElementById("name").value
            );

            window.location.href = "dashboard.html";
        });
    </script>

</body>
</html>
